<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- Oval border -->
  <ellipse cx="160" cy="110" rx="155" ry="105" fill="white" stroke="#111" stroke-width="3"/>

  <!-- Lightning bolt - green layer (right/back) -->
  <polygon points="175,10 220,10 195,85 235,85 130,210 145,120 105,120"
           fill="#2E7D32"/>

  <!-- Lightning bolt - red layer (left/front) -->
  <polygon points="145,10 190,10 165,85 205,85 100,210 115,120 75,120"
           fill="#D32F2F"/>

  <!-- Yellow star at center of bolt -->
  <polygon points="148,148 152,136 156,148 169,148 159,156 163,168 152,161 141,168 145,156 135,148"
           fill="#FFD600" stroke="#111" stroke-width="0.8"/>

  <!-- SONABEL text -->
  <text x="160" y="76"
        font-family="Arial Black, Impact, sans-serif"
        font-size="34"
        font-weight="900"
        text-anchor="middle"
        fill="#FFD600"
        stroke="#111"
        stroke-width="2.5"
        paint-order="stroke fill"
        letter-spacing="2">SONABEL</text>
</svg>
